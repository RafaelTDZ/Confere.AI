name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint e typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validar project ref do Supabase
        run: |
          set -euo pipefail
          expected="pavxbcsolcvekwslhzmf"
          old="xmvypuwizexdhpwr""grao"
          # Ignora apenas o registro histórico; o ref antigo é montado em partes
          # para não casar com este próprio workflow.
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
            --exclude=ANALISE-ESTRUTURA.md "$old" .; then
            echo "::error::Project ref antigo ($old) encontrado no repositório"
            exit 1
          fi
          if ! grep -q "NEXT_PUBLIC_SUPABASE_URL=https://${expected}.supabase.co" .env.example; then
            echo "::error::.env.example não aponta para o project ref $expected"
            exit 1
          fi
          for file in README.md AGENTS.md; do
            if ! grep -q "$expected" "$file"; then
              echo "::error::$file não contém o project ref $expected"
              exit 1
            fi
          done
          echo "Project ref OK: $expected"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes e cobertura
        run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
